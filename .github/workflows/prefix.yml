# main is an exact prefix of dev, and this is what says so out loud when it stops being one.
#
# The rule it guards is in CONTRIBUTING: everything enters dev by a pull request merged with the
# rebase button, and dev reaches main by a FAST-FORWARD and by no button. All three merge buttons
# rewrite, and main is already an ancestor of dev, so pressing one would give main a second copy
# of every commit under a fresh hash and leave the two branches holding the same work under two
# histories.
#
# Nothing on GitHub can prevent that press: which merge buttons a repository offers is a setting
# of the repository and not of the target, and the button dev needs for a topic branch is the very
# one that is wrong here. So this is detection rather than prevention, within a minute of the push
# rather than at the next release, while main can still be reset onto dev with nothing built on
# top of it.
#
# The gesture it guards is one line, git push origin origin/dev:main, and the pull request closes
# itself as merged once its commits are there.

name: prefix

on:
  push:
    branches: [main]
  # For a state settled by hand, so the question can be asked again without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefix:
    runs-on: ubuntu-latest

    steps:
      - name: Take both long-lived branches
        uses: actions/checkout@v4
        with:
          # The whole history, since the question is about an ancestry reaching back to the first
          # commit. A shallow clone answers "not an ancestor" for a graft it cannot see.
          fetch-depth: 0

      - name: main is an ancestor of dev
        run: |
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "main is contained in dev, so it is still an exact prefix of it."
            exit 0
          fi

          echo "::error::main carries commits dev does not, so it has stopped being an exact"
          echo "::error::prefix of dev. That is what a merge button does to this pair: it replays"
          echo "::error::dev's commits under fresh hashes instead of moving the pointer. Reset"
          echo "::error::main onto dev with a fast-forward before anything else lands on it."
          echo
          echo "On main and not on dev:"
          git log --oneline origin/dev.."$GITHUB_SHA"
          exit 1
