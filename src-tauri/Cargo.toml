[package]
name = "gitlanes"
version = "0.5.0"
edition = "2021"
description = "The commit graph of a local repository"
authors = ["avpbynf"]
default-run = "gitlanes"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the system's own folder window, which is the only honest way to ask for a path
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
